name: Firebase RTDB contract validation
on:
  push:
    branches: [main, repair/firebase-contract-20261101]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-contract.mjs
