name: Firebase database rules emulator security
on:
  push:
    branches: [feature/firebase-realtime-no-loss-20261101]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install emulator testing tools
        run: npm install --no-save --package-lock=false firebase-tools @firebase/rules-unit-testing
      - name: Test authenticated user isolation
        run: npx firebase emulators:exec --only database --project demo-dwiju-rules "node scripts/test-firebase-rules.cjs"
