name: Firebase additive integration build
on:
  push:
    branches:
      - feature/firebase-realtime-no-loss-20261101
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lockfile in CI workspace
        run: npm install --package-lock-only --ignore-scripts
      - name: Ensure Firebase dependency resolves
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Validate proposed rules JSON
        run: node -e "const r=require('./firebase.database.rules.json').rules; if(!r.users || !Object.keys(r.users).some(k=>k.charCodeAt(0)===36)) process.exit(1)"
      - name: Commit regenerated lockfile only to integration branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/firebase-realtime-no-loss-20261101'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- package-lock.json
            git diff --cached --check
            git commit -m "build(firebase): synchronize npm lockfile"
            git push origin HEAD:feature/firebase-realtime-no-loss-20261101
          fi
      - name: Require committed lockfile on branch pushes
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            echo "::error::Lockfile drift remains"
            exit 1
          fi
